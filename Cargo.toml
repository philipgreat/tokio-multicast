[package]
name = "tokio-multicast"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/tokio-multicast"
description = "Small Tokio helpers for UDP multicast send/receive."
keywords = ["tokio", "multicast", "udp", "network", "async"]
categories = ["asynchronous", "network-programming"]
exclude = ["target/*"]

[dependencies]
bytes = "1"
libc = "0.2"
socket2 = "0.5"
tokio = { version = "1", features = ["macros", "net", "rt", "time", "sync"] }
